<style id="player-layout-fix">
.player .video-wrap{
  position:relative !important;
  height:min(48vw,200px) !important;
  min-height:168px !important;
  background:#000 !important;
  overflow:hidden !important;
}
.player .video-wrap > video{
  width:100% !important; height:100% !important;
  object-fit:contain !important; display:block !important;
}
.player .visual{
  position:absolute !important; left:0 !important; right:0 !important; top:0 !important; bottom:0 !important;
  width:100% !important; height:100% !important;
  display:block !important;
  pointer-events:none !important;
  background:transparent !important;
  padding:0 !important; margin:0 !important; gap:0 !important;
  z-index:3 !important;
}
.player .visual *{ pointer-events:auto; }
.player #centerPlay,
.player .center-play-only{
  position:absolute !important;
  left:50% !important; top:50% !important;
  right:auto !important; bottom:auto !important;
  margin:0 !important;
  transform:translate(-50%,-50%) !important;
  width:34px !important; height:34px !important;
  border-radius:50% !important;
  display:grid !important; place-items:center !important;
  z-index:5 !important;
  background:rgba(0,0,0,.55) !important;
  border:none !important;
  box-shadow:none !important;
}
.player #centerPlay .svg-ico,
.player .center-play-only .svg-ico{
  width:18px !important; height:18px !important;
  color:var(--accent,#e11d48) !important;
}
.player #audioOnlyBtn,
.player .side-left{
  position:absolute !important;
  left:8px !important; bottom:8px !important; top:auto !important;
  transform:none !important;
  width:26px !important; height:26px !important;
  z-index:6 !important;
  margin:0 !important;
}
.player .side-stack.side-right{
  position:absolute !important;
  right:8px !important; bottom:8px !important; top:auto !important;
  transform:none !important;
  display:flex !important; flex-direction:row !important; gap:4px !important;
  z-index:6 !important; margin:0 !important;
}
.player .side-fab{
  width:26px !important; height:26px !important;
  border-radius:8px !important;
  display:grid !important; place-items:center !important;
  background:rgba(0,0,0,.7) !important;
  border:1px solid rgba(255,255,255,.12) !important;
  color:var(--accent,#e11d48) !important;
}
.player .player-actions{ display:flex !important; gap:6px !important; }
.player .player-actions button{
  width:32px !important; height:32px !important;
  display:grid !important; place-items:center !important;
  border-radius:10px !important;
  background:rgba(0,0,0,.4) !important;
  color:var(--accent,#e11d48) !important;
}
.player .player-actions #ccTopBtn{
  width:auto !important; padding:0 8px !important; font-weight:700 !important;
}
.player .controls .bottom-bar{
  display:flex !important; justify-content:space-between !important;
  align-items:center !important; padding:8px 12px 12px !important;
}
.player .transport, .player .floating-tools, .player .volume-wrap{ display:none !important; }
/* dock */

.player .dock-bar{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:8px 10px!important;border-radius:18px!important;background:linear-gradient(145deg,rgba(18,20,28,.92),rgba(6,7,12,.88))!important;border:1px solid rgba(255,255,255,.08)!important}

.player .dock-btn .svg-ico,.player .dock-btn svg{width:22px!important;height:22px!important;color:var(--accent)!important;fill:currentColor!important}
.player .dock-btn.dock-label span{font-size:11px!important;font-weight:800!important;color:var(--accent)!important}
.player .head-btn{width:34px!important;height:34px!important;display:grid!important;place-items:center!important;border-radius:11px!important;background:rgba(0,0,0,.35)!important;border:1px solid rgba(255,255,255,.08)!important;color:var(--accent)!important}
